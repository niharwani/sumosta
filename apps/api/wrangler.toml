name = "sumosta-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Embed .ttf files as ArrayBuffer imports so the PDF invoice generator
# can register real fonts (Inter) with pdf-lib. Fonts live in assets/fonts/
# and are checked into git.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[vars]
BASE_URL = "https://master.sumosta-web.pages.dev"
WORKER_URL = "https://sumosta-api.sumosta-dev.workers.dev"
RESEND_FROM          = "SUMOSTA <orders@sumosta.com>"
RESEND_FROM_ORDERS   = "SUMOSTA Orders <orders@sumosta.com>"
RESEND_FROM_NOREPLY  = "SUMOSTA <no-reply@sumosta.com>"
SUPPORT_EMAIL        = "hello@sumosta.com"

# Shiprocket — pickup nickname must exactly match the one saved in
# Shiprocket panel → Settings → Pickup Addresses.
SHIPROCKET_PICKUP_LOCATION = "Primary"

# ─── GST invoice — seller identity ────────────────────────────
# Populate all four to turn every invoice into a valid GST tax
# invoice. While empty, invoice.ts falls back to the historic
# "raw honey · bengaluru, in" line and stamps the PDF with
# "(Draft — GSTIN pending)". Do NOT commit the real GSTIN if
# this file is public; use `wrangler secret put SELLER_GSTIN`
# instead and remove the line here.
# SELLER_LEGAL_NAME    = "Sumosta Foods Pvt Ltd"
# SELLER_GSTIN         = "29ABCDE1234F1Z5"
# SELLER_ADDRESS_BLOCK = "12 First Cross, Indiranagar\nBengaluru 560038\nKarnataka, India"
# SELLER_STATE         = "Karnataka"

[[d1_databases]]
binding = "DB"
database_name = "sumosta-db"
database_id = "7a171634-4f06-42dd-b498-9170f4f4e09f"

[[r2_buckets]]
binding = "R2"
bucket_name = "sumosta-assets"

[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "67beb9fb9c4e4dd9a3cd57a20c2a8f24"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "1419cfd9d0b248589435d8362ed11374"

# Analytics Engine — uncomment after enabling in Cloudflare dashboard
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "sumosta_events"

[triggers]
crons = ["0 18 * * *"]

# Secrets (set via: wrangler secret put SECRET_NAME)
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET
# RAZORPAY_WEBHOOK_SECRET  — Set when you register the webhook in the Razorpay dashboard.
#                            Until this is set, POST /api/razorpay/webhook safely no-ops.
# JWT_SECRET
# REFRESH_TOKEN_SECRET
# RESEND_API_KEY
# SHIPROCKET_EMAIL         — Shiprocket API user email (Panel → Settings → API)
# SHIPROCKET_PASSWORD      — Shiprocket API user password
# SHIPROCKET_WEBHOOK_TOKEN — Shared secret sent in x-api-key header by Shiprocket webhooks
#                            (paste same value into Shiprocket Panel → Settings → Webhooks)

[dev]
port = 8787
