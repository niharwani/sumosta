<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F0" />
      <stop offset="50%" stop-color="#FFE0A8" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B7355" />
      <stop offset="100%" stop-color="#5C4A32" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#FDF6EC" />
  <g transform="translate(0, 10)">
    <ellipse cx="150" cy="350" rx="80" ry="12" fill="#2C2417" opacity="0.1" />
    <path d="M 95 90 C 95 85, 205 85, 205 90 L 212 130 C 220 150, 235 170, 235 220 C 235 300, 205 340, 150 340 C 95 340, 65 300, 65 220 C 65 170, 80 150, 88 130 Z" fill="url(#liquidGrad)" stroke="#5C4A32" stroke-width="2.5" />
    <path d="M 78 200 Q 72 230 80 270" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.25" />
    
    <!-- Extra graphics inside jar -->
    <!-- Nut outlines inside jar -->
     <circle cx="120" cy="280" r="10" fill="#8B7355" opacity="0.6"/>
     <circle cx="170" cy="270" r="12" fill="#5C4A32" opacity="0.6"/>
     <circle cx="140" cy="300" r="8" fill="#8B7355" opacity="0.6"/>
    
    <!-- Label -->
    <rect x="90" y="170" width="120" height="90" rx="6" fill="#FFFDF8" stroke="#F5A623" stroke-width="1" />
    <rect x="94" y="174" width="112" height="82" rx="4" fill="none" stroke="#F5A623" stroke-width="0.5" stroke-dasharray="3 2" />
    <text x="150" y="198" font-family="Georgia, serif" font-weight="bold" font-size="13" fill="#2C2417" text-anchor="middle">SUMOSTA</text>
    <text x="150" y="215" font-family="sans-serif" font-size="7" font-weight="bold" fill="#8B7355" tracking="1" text-anchor="middle">COMING SOON</text>
    <text x="150" y="228" font-family="sans-serif" font-size="8" font-weight="bold" fill="#A66A10" text-anchor="middle">HONEY SOAKED NUTS</text>
    <text x="150" y="240" font-family="sans-serif" font-size="6" fill="#8B7355" text-anchor="middle">WALNUT ALMOND BLEND</text>
    
    <!-- Lid -->
    <rect x="90" y="55" width="120" height="28" rx="4" fill="url(#lidGrad)" stroke="#2C2417" stroke-width="2" />
    <line x1="90" y1="69" x2="210" y2="69" stroke="#2C2417" stroke-width="1.5" />
    <!-- Neck Ribbon -->
    <path d="M 94 83 C 94 83, 110 88, 150 88 C 190 88, 206 83, 206 83" fill="none" stroke="#C4573A" stroke-width="3" />
  </g>
</svg>